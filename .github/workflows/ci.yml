name: Week 7 checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rozgar
          POSTGRES_PASSWORD: rozgar_test_only
          POSTGRES_DB: rozgar_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U rozgar -d rozgar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check app database.py alembic tests scripts
      - run: pytest -q
      - run: python scripts/benchmark_search.py
      - run: docker build -t rozgar-week7-check .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA==
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: Frontend/playwright-report/
          retention-days: 7
