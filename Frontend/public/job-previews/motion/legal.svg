<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Accord Legal interface preview</title>
  <desc id="desc">Illustrative fictional legal application interface; not a screenshot of an employer product.</desc>
  <style>
    /* Edit these palette tokens to restyle this sample. Geometry lives in LAYOUT in the generator. */
    svg { --bg:#ececf2; --bg2:#f9f9fb; --ink:#353b50; --muted:#8e93a4; --accent:#767f9a; --accent-soft:#eef0f6; --border:#e1e4ec; --surface:#ffffff; --line:#e1e4ec; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }

    /* One six-second loop; the host unmounts this document on card leave. */
    .motion-pointer{animation:pointerRoute 6s ease-in-out infinite;filter:drop-shadow(0 3px 4px #151c3760)}.motion-tap{animation:pointerTap 6s ease-out infinite;transform-origin:2px 2px}@keyframes pointerRoute{0%{transform:translate(782px,407px)}23%{transform:translate(384px,264px)}56%,76%{transform:translate(616px,328px)}100%{transform:translate(782px,407px)}}@keyframes pointerTap{0%,52%,60%,100%{opacity:0;transform:scale(.4)}56%{opacity:.8;transform:scale(1.5)}59%{opacity:0;transform:scale(2)}}.motion-row-1{animation:row1 6s ease-out infinite}@keyframes row1{0%,8%{opacity:.32;transform:translateY(5px)}16%,91%{opacity:1;transform:translateY(0)}100%{opacity:.32;transform:translateY(5px)}}.motion-row-2{animation:row2 6s ease-out infinite}@keyframes row2{0%,21%{opacity:.32;transform:translateY(5px)}29%,91%{opacity:1;transform:translateY(0)}100%{opacity:.32;transform:translateY(5px)}}.motion-row-3{animation:row3 6s ease-out infinite}@keyframes row3{0%,34%{opacity:.32;transform:translateY(5px)}42%,91%{opacity:1;transform:translateY(0)}100%{opacity:.32;transform:translateY(5px)}}.motion-trace{stroke-dasharray:270;stroke-dashoffset:270;animation:trace 6s ease-in-out infinite}@keyframes trace{0%,14%{stroke-dashoffset:270}73%,91%{stroke-dashoffset:0}100%{stroke-dashoffset:270}}
    @media(prefers-reduced-motion:reduce){.motion-pointer,.motion-tap{display:none}.motion-row,.motion-layer,.motion-swatch,.motion-art,.motion-line,.motion-area,.motion-bar,.motion-dot,.motion-fill,.motion-kpi,.motion-calendar,.motion-trace,.motion-scan{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
